    <style>
        /* Efek Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Animasi Loading Tombol */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Slider Gambar Efek Fade */
        .fade-slider {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 1.5rem;
            overflow: hidden;
            background-color: #f9fafb;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .fade-slider img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            opacity: 0;
            animation: fade 25s infinite;
        }
        
        /* Urutan Tampil Gambar */
        .fade-slider img:nth-child(1) { animation-delay: 0s; }
        .fade-slider img:nth-child(2) { animation-delay: 5s; }
        .fade-slider img:nth-child(3) { animation-delay: 10s; }
        .fade-slider img:nth-child(4) { animation-delay: 15s; }
        .fade-slider img:nth-child(5) { animation-delay: 20s; }

        @keyframes fade {
            0%, 15% { opacity: 1; z-index: 1; }
            20%, 95% { opacity: 0; z-index: 0; }
            100% { opacity: 1; z-index: 1; }
        }
    </style>
</head>
