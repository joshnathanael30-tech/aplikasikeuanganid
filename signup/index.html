<script>
(function() {
  var RELOAD_KEY = 'keuangan_tailwind_reload_count';
  var MAX_RELOADS = 2;
  var CHECK_DELAY_MS = 2500;
  function getReloadCount() {
    try { return parseInt(sessionStorage.getItem(RELOAD_KEY) || '0', 10); } catch(e) { return 0; }
  }
  function setReloadCount(n) {
    try { sessionStorage.setItem(RELOAD_KEY, String(n)); } catch(e) {}
  }
  window.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      var test = document.createElement('div');
      test.className = 'flex';
      test.style.position = 'absolute';
      test.style.visibility = 'hidden';
      test.style.pointerEvents = 'none';
      document.body.appendChild(test);
      var computedDisplay = window.getComputedStyle(test).display;
      document.body.removeChild(test);
      if (computedDisplay !== 'flex') {
        var count = getReloadCount();
        if (count < MAX_RELOADS) {
          setReloadCount(count + 1);
          location.reload();
        }
      } else {
        setReloadCount(0);
      }
    }, CHECK_DELAY_MS);
  });
})();
</script>

<script>
const GLOBAL_GS_URL = 'https://script.google.com/macros/s/AKfycbxC6ZbEz0GDuxLaqkNYQEQsO4-WLB5dnEPHBhqBjqovaAizmPqlCcxBvLWTHmcD5Jth/exec';
const GOOGLE_CLIENT_ID = '447280631672-vusej7mqo02foleg4pddnee1epd65doq.apps.googleusercontent.com';
const AUTH_SESSION_KEY = 'keuangan_akun_session';

// State Pre-Creation Spreadsheet secara senyap di belakang layar (tanpa menampilkan tulisan di UI)
var bgSheetState = {
  promise: null,
  readyData: null,
  email: ''
};
var googleTokenClient = null;

// ── STORAGE ABSTRACTION (localStorage -> cookie -> memory) ──
var _storageMode = null;
var _memoryStore = {};
function detectStorageMode() {
  if (_storageMode) return _storageMode;
  try {
    localStorage.setItem('__storage_test__', '1');
    localStorage.removeItem('__storage_test__');
    _storageMode = 'localStorage';
    return _storageMode;
  } catch(e) {}
  try {
    document.cookie = '__storage_test__=1; SameSite=Lax; path=/';
    var ok = document.cookie.indexOf('__storage_test__=1') !== -1;
    document.cookie = '__storage_test__=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
    if (ok) { _storageMode = 'cookie'; return _storageMode; }
  } catch(e) {}
  _storageMode = 'memory';
  return _storageMode;
}
function storageGet(key) {
  var mode = detectStorageMode();
  if (mode === 'localStorage') { try { return localStorage.getItem(key); } catch(e) { return null; } }
  if (mode === 'cookie') {
    try {
      var m = document.cookie.match(new RegExp('(?:^|; )' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    } catch(e) { return null; }
  }
  return _memoryStore[key] || null;
}
function storageSet(key, value) {
  var mode = detectStorageMode();
  if (mode === 'localStorage') { try { localStorage.setItem(key, value); return true; } catch(e) { return false; } }
  if (mode === 'cookie') {
    try {
      var exp = new Date(Date.now() + 90 * 86400000).toUTCString();
      document.cookie = key + '=' + encodeURIComponent(value) + '; expires=' + exp + '; SameSite=Lax; path=/';
      return true;
    } catch(e) { return false; }
  }
  _memoryStore[key] = value;
  return true;
}

function getAkunSession() {
  try {
    const raw = storageGet(AUTH_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveAkunSession(akunData) {
  try {
    const toSave = {
      username: akunData.username,
      email: akunData.email || '',
      namaLengkap: akunData.namaLengkap || '',
      tanggalLahir: akunData.tanggalLahir || '',
      id: akunData.id,
      gsUrl: akunData.gsUrl || '',
    };
    storageSet(AUTH_SESSION_KEY, JSON.stringify(toSave));
    try {
      var exp = new Date(Date.now() + 90 * 86400000).toUTCString();
      document.cookie = AUTH_SESSION_KEY + '=' + encodeURIComponent(JSON.stringify(toSave)) + '; expires=' + exp + '; SameSite=Lax; path=/';
    } catch(e) {}
  } catch(e) {}
}

function redirectToHome() {
  try {
    window.top.location.href = 'https://keloladuit.my.id/home';
  } catch(e) {
    window.location.href = 'https://keloladuit.my.id/home';

}

async function callMasterApi(action, data) {
  try {
    const r = await fetch(GLOBAL_GS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action, data })
    });
    const j = await r.json();
    if (j) return j;
  } catch(err) {}
  const url = GLOBAL_GS_URL + '?action=' + encodeURIComponent(action) + '&payload=' + encodeURIComponent(JSON.stringify(data || {})) + '&_t=' + Date.now();
  const r2 = await fetch(url);
  return await r2.json();
}

window.toggleRegPasswordVisibility = function() {
  const inp = document.getElementById('register-password');
  const eyeOpen = document.getElementById('reg-eye-open');
  const eyeClosed = document.getElementById('reg-eye-closed');
  if (!inp) return;
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  eyeOpen?.classList.toggle('hidden', isPass);
  eyeClosed?.classList.toggle('hidden', !isPass);
};

// ── INISIALISASI GOOGLE IDENTITY SERVICES (1 TOMBOL SAJA) ──
function decodeJwtPayload(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch (e) {
    return null;
  }
}

function initGoogleAuth() {
  if (!window.google || !window.google.accounts) {
    setTimeout(initGoogleAuth, 300);
    return;
  }
  try {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredentialResponse,
      auto_select: false,
      cancel_on_tap_outside: true
    });
  } catch(e) {}

  try {
    if (google.accounts.oauth2) {
      googleTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'openid email profile',
        callback: async function(tokenResponse) {
          if (tokenResponse && tokenResponse.access_token) {
            try {
              const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: 'Bearer ' + tokenResponse.access_token }
              });
              const profile = await r.json();
              if (profile && profile.email) {
                onGoogleAccountLinked({
                  email: profile.email,
                  name: profile.name || profile.given_name || '',
                  picture: profile.picture || ''
                });
              }
            } catch (err) {
              const msgEl = document.getElementById('register-msg');
              if (msgEl) msgEl.textContent = 'Gagal mengambil profil Google. Silakan coba lagi.';
            }
          }
        }
      });
    }
  } catch(e) {}
}

window.triggerGoogleOAuthPopup = function() {
  if (googleTokenClient) {
    googleTokenClient.requestAccessToken({ prompt: 'select_account' });
  } else if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.prompt();
  } else {
    const msgEl = document.getElementById('register-msg');
    if (msgEl) msgEl.textContent = 'Layanan Google sedang dimuat, tunggu sebentar lalu klik lagi.';
  }
};

function handleGoogleCredentialResponse(response) {
  if (!response || !response.credential) return;
  const payload = decodeJwtPayload(response.credential);
  if (payload && payload.email) {
    onGoogleAccountLinked({
      email: payload.email,
      name: payload.name || payload.given_name || '',
      picture: payload.picture || ''
    });
  }
}

// ── ALUR SETELAH USER TAUTKAN AKUN GOOGLE ──
async function onGoogleAccountLinked(profile) {
  const email = String(profile.email || '').trim();
  const name  = String(profile.name || '').trim();
  const msgEl = document.getElementById('register-msg');
  if (msgEl) {
    msgEl.style.color = '#059669';
    msgEl.textContent = 'Memeriksa akun Google…';
  }

  try {
    const res = await callMasterApi('checkGoogleAccount', { email: email, namaLengkap: name });
    if (res && res.status === 'success' && res.registered === true && res.data) {
      saveAkunSession(res.data);
      if (profile.picture) storageSet('keuangan_user_avatar', profile.picture);
      try { sessionStorage.setItem('keuangan_pin_unlocked', '1'); } catch(e) {}
      if (msgEl) {
        msgEl.style.color = '#10B981';
        msgEl.textContent = 'Akun Google sudah terdaftar! Mengalihkan ke Beranda…';
      }
      redirectToHome();
      return;
    }

    const suggestedUname = (res && res.data && res.data.suggestedUsername)
      ? res.data.suggestedUsername
      : email.split('@')[0].replace(/[^a-zA-Z0-9._]/g, '').toLowerCase();

    openGoogleConfirmationForm({
      email: email,
      name: name,
      picture: profile.picture || '',
      suggestedUsername: suggestedUname
    });
  } catch (err) {
    openGoogleConfirmationForm({
      email: email,
      name: name,
      picture: profile.picture || '',
      suggestedUsername: email.split('@')[0].replace(/[^a-zA-Z0-9._]/g, '').toLowerCase()
    });
  }
}

function openGoogleConfirmationForm(info) {
  document.getElementById('signup-main-view').classList.add('hidden');
  document.getElementById('google-confirm-view').classList.remove('hidden');
  document.getElementById('header-title').textContent = 'Pastikan Data Akun ✨';
  document.getElementById('header-subtitle').textContent = 'Lengkapi data profilmu di bawah ini untuk langsung masuk.';

  const av = document.getElementById('gconf-avatar');
  if (av && info.picture) {
    av.src = info.picture;
    av.classList.remove('hidden');
  }

  document.getElementById('gconf-username').value = info.suggestedUsername || '';
  document.getElementById('gconf-email').value = info.email || '';
  document.getElementById('gconf-nama').value = info.name || '';
  document.getElementById('gconf-tgllahir').value = '';
  document.getElementById('gconf-msg').textContent = '';

  // Buat spreadsheet secara senyap di belakang layar tanpa menampilkan tulisan apa pun
  startBackgroundSheetPrecreation(info.email, info.name);
}

window.cancelGoogleConfirm = function() {
  document.getElementById('google-confirm-view').classList.add('hidden');
  document.getElementById('signup-main-view').classList.remove('hidden');
  document.getElementById('header-title').textContent = 'Buat Akun Baru ✨';
  document.getElementById('header-subtitle').textContent = 'Tautkan akun Google untuk daftar lebih cepat atau isi formulir di bawah.';
  document.getElementById('register-msg').textContent = '';
};

window.triggerSilentPrecreate = function() {
  if (bgSheetState.promise || bgSheetState.readyData) return;
  startBackgroundSheetPrecreation('', 'User Baru');
};

function startBackgroundSheetPrecreation(email, namaLengkap) {
  if (bgSheetState.readyData && (!email || bgSheetState.email === email)) {
    return bgSheetState.promise;
  }
  if (bgSheetState.promise) {
    return bgSheetState.promise;
  }

  bgSheetState.email = email || '';
  bgSheetState.readyData = null;

  bgSheetState.promise = (async function() {
    try {
      const res = await callMasterApi('precreateUserSheet', {
        email: email || '',
        namaLengkap: namaLengkap || 'User Baru'
      });
      if (res && res.status === 'success' && res.data && res.data.gsUrl) {
        bgSheetState.readyData = res.data;
        return res.data;
      }
    } catch (e) {}
    return null;
  })();

  return bgSheetState.promise;
}

async function handleGoogleConfirmSubmit(e) {
  e.preventDefault();
  const username     = document.getElementById('gconf-username').value.trim();
  const email        = document.getElementById('gconf-email').value.trim();
  const namaLengkap  = document.getElementById('gconf-nama').value.trim();
  const tanggalLahir = document.getElementById('gconf-tgllahir').value.trim();
  const msgEl        = document.getElementById('gconf-msg');
  msgEl.style.color  = '#EF4444';
  msgEl.textContent  = '';

  if (!username || !email || !namaLengkap || !tanggalLahir) {
    msgEl.textContent = 'Semua kolom wajib diisi.';
    return;
  }

  const btn  = document.getElementById('gconf-submit-btn');
  const icon = document.getElementById('gconf-submit-icon');
  const spin = document.getElementById('gconf-submit-spin');
  btn.disabled = true;
  icon?.classList.add('hidden');
  spin?.classList.remove('hidden');

  try {
    let sheetInfo = bgSheetState.readyData;
    if (!sheetInfo && bgSheetState.promise) {
      sheetInfo = await bgSheetState.promise;
    }

    const payload = {
      username:     username,
      email:        email,
      namaLengkap:  namaLengkap,
      tanggalLahir: tanggalLahir,
      password:     'GOOGLE_' + email,
      precreated:   Boolean(sheetInfo && sheetInfo.gsUrl),
      sheetId:      sheetInfo ? (sheetInfo.sheetId || '') : '',
      gsUrl:        sheetInfo ? (sheetInfo.gsUrl || '') : '',
      sheetUrl:     sheetInfo ? (sheetInfo.sheetUrl || '') : ''
    };

    let res = await callMasterApi('registerGoogleAkun', payload);
    if (res && res.status === 'error' && String(res.message || '').indexOf('Aksi tidak dikenal') !== -1) {
      res = await callMasterApi('registerAkun', payload);
    }

    if (res && res.status === 'success' && res.data) {
      saveAkunSession(res.data);
      const avSrc = document.getElementById('gconf-avatar')?.src;
      if (avSrc && avSrc.indexOf('http') === 0) {
        storageSet('keuangan_user_avatar', avSrc);
      }
      try { sessionStorage.setItem('keuangan_pin_unlocked', '1'); } catch(err) {}
      msgEl.style.color = '#10B981';
      msgEl.textContent = 'Akun siap! Mengalihkan ke Beranda…';
      redirectToHome();
    } else {
      msgEl.style.color = '#EF4444';
      msgEl.textContent = (res && res.message) ? res.message : 'Gagal menyimpan akun. Coba pilih username lain.';
    }
  } catch (err) {
    msgEl.style.color = '#EF4444';
    msgEl.textContent = 'Gagal terhubung ke server. Periksa koneksi internet.';
  } finally {
    btn.disabled = false;
    icon?.classList.remove('hidden');
    spin?.classList.add('hidden');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const session = getAkunSession();
  const params = new URLSearchParams(window.location.search);
  if (session && session.username && session.gsUrl && !params.get('switch')) {
    redirectToHome();
    return;
  }
  document.getElementById('register-form')?.addEventListener('submit', handleRegisterSubmit);
  document.getElementById('google-confirm-form')?.addEventListener('submit', handleGoogleConfirmSubmit);
  initGoogleAuth();
});

async function handleRegisterSubmit(e) {
  e.preventDefault();
  const username     = document.getElementById('register-username').value.trim();
  const password     = document.getElementById('register-password').value;
  const email        = document.getElementById('register-email').value.trim();
  const namaLengkap  = document.getElementById('register-nama').value.trim();
  const tanggalLahir = document.getElementById('register-tgllahir').value.trim();
  const msgEl        = document.getElementById('register-msg');
  msgEl.style.color  = '#EF4444';
  msgEl.textContent  = '';

  if (!username || !password || !email || !namaLengkap || !tanggalLahir) {
    msgEl.textContent = 'Semua kolom wajib diisi.';
    return;
  }
  if (password.length < 4) {
    msgEl.textContent = 'Password minimal 4 karakter.';
    return;
  }

  const btn  = document.getElementById('register-submit-btn');
  const icon = document.getElementById('register-submit-icon');
  const spin = document.getElementById('register-submit-spin');
  btn.disabled = true;
  icon?.classList.add('hidden');
  spin?.classList.remove('hidden');

  try {
    let sheetInfo = bgSheetState.readyData;
    if (!sheetInfo && bgSheetState.promise) {
      sheetInfo = await bgSheetState.promise;
    }

    const payload = {
      username:     username,
      password:     password,
      email:        email,
      namaLengkap:  namaLengkap,
      tanggalLahir: tanggalLahir,
      precreated:   Boolean(sheetInfo && sheetInfo.gsUrl),
      sheetId:      sheetInfo ? (sheetInfo.sheetId || '') : '',
      gsUrl:        sheetInfo ? (sheetInfo.gsUrl || '') : '',
      sheetUrl:     sheetInfo ? (sheetInfo.sheetUrl || '') : ''
    };

    const j = await callMasterApi('registerAkun', payload);
    if (j && j.status === 'success') {
      if (!j.data.gsUrl) {
        msgEl.style.color = '#059669';
        msgEl.textContent = 'Akun dibuat! Silakan masuk melalui halaman Login.';
        setTimeout(() => {
          try { window.top.location.href = 'https://keloladuit.my.id/login'; }
          catch(err) { window.location.href = 'https://keloladuit.my.id/login'; }
        }, 1200);
        return;
      }
      saveAkunSession(j.data);
      try { sessionStorage.setItem('keuangan_pin_unlocked', '1'); } catch(err) {}
      msgEl.style.color = '#10B981';
      msgEl.textContent = 'Akun berhasil dibuat! Mengalihkan ke Beranda…';
      redirectToHome();
    } else {
      msgEl.style.color = '#EF4444';
      msgEl.textContent = (j && j.message) || 'Registrasi gagal. Coba pilih username lain.';
    }
  } catch (err) {
    msgEl.style.color = '#EF4444';
    msgEl.textContent = 'Gagal terhubung ke server. Periksa koneksi internet.';
  } finally {
    btn.disabled = false;
    icon?.classList.remove('hidden');
    spin?.classList.add('hidden');
  }
}
