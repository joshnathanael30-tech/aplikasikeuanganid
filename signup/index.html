<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daftar Akun — Keloladuit.id</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
(function() {
  var RELOAD_KEY = 'keuangan_tailwind_reload_count';
  var MAX_RELOADS = 2;
  var CHECK_DELAY_MS = 2500;
  function getReloadCount() {
    try { return parseInt(sessionStorage.getItem(RELOAD_KEY) || '0', 10); } catch(e) { return 0; }
  }
  function setReloadCount(n) {
    try { sessionStorage.setItem(RELOAD_KEY, String(n)); } catch(e) {}
  }
  window.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      var test = document.createElement('div');
      test.className = 'flex';
      test.style.position = 'absolute';
      test.style.visibility = 'hidden';
      test.style.pointerEvents = 'none';
      document.body.appendChild(test);
      var computedDisplay = window.getComputedStyle(test).display;
      document.body.removeChild(test);
      if (computedDisplay !== 'flex') {
        var count = getReloadCount();
        if (count < MAX_RELOADS) {
          setReloadCount(count + 1);
          location.reload();
        }
      } else {
        setReloadCount(0);
      }
    }, CHECK_DELAY_MS);
  });
})();
</script>
<style>
:root {
  --bg: #F0F4F8;
  --plum: #5B2C4D;
  --plum-light: #7C3E66;
  --peach: #FBBFA0;
  --gold: #F0D878;
}
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: #18181B;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

.auth-shell {
  width: 100%;
  max-width: 448px;
  min-height: 100vh;
  margin: 0 auto;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 48px rgba(0, 0, 0, 0.06);
  overflow: hidden;
}
.auth-header {
  position: relative;
  flex-shrink: 0;
  height: 32vh;
  min-height: 220px;
  max-height: 300px;
  overflow: hidden;
  background: var(--peach);
}
.auth-blob { position: absolute; border-radius: 50%; }
.auth-blob-1 {
  width: 130%;
  height: 100%;
  left: -15%;
  top: -10%;
  background: linear-gradient(160deg, #7C3E66, #5B2C4D);
  border-radius: 40% 60% 65% 35% / 45% 40% 60% 55%;
}
.auth-blob-2 {
  width: 60%;
  height: 70%;
  right: -15%;
  top: 15%;
  background: linear-gradient(135deg, #F0D878, #E8C858);
  border-radius: 55% 45% 40% 60% / 60% 55% 45% 40%;
}
.auth-brand-pill {
  position: absolute;
  top: 22px;
  left: 24px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #FFFFFF;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.03em;
}
.auth-header-title {
  position: absolute;
  left: 24px;
  bottom: 28px;
  z-index: 2;
  font-size: 32px;
  font-weight: 900;
  color: #FFFFFF;
  line-height: 1.15;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
}
.auth-body {
  flex: 1;
  padding: 28px 28px 36px;
  display: flex;
  flex-direction: column;
}
.auth-desc {
  font-size: 13px;
  color: #A1A1AA;
  font-weight: 600;
  margin-bottom: 22px;
}
.auth-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.auth-field { position: relative; }
.auth-field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #A1A1AA;
  margin-bottom: 6px;
}
.auth-form input {
  width: 100%;
  padding: 6px 36px 10px 0;
  border: none;
  border-bottom: 1.5px solid #E4E4E7;
  outline: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  color: #18181B;
  background: transparent;
  transition: border-color 0.18s;
}
.auth-form input::placeholder { color: #D4D4D8; font-weight: 500; }
.auth-form input:focus { border-color: #5B2C4D; }
.pw-toggle-btn {
  position: absolute;
  right: 0;
  bottom: 8px;
  background: none;
  border: none;
  padding: 4px;
  color: #A1A1AA;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pw-toggle-btn:hover { color: #52525B; }
.auth-submit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
}
.auth-submit-label {
  font-size: 19px;
  font-weight: 900;
  color: #18181B;
}
.auth-form button[type="submit"] {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  flex-shrink: 0;
  background: linear-gradient(135deg, #7C3E66, #5B2C4D);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 20px -6px rgba(91, 44, 77, 0.5);
  transition: transform 0.12s, opacity 0.2s;
}
.auth-form button[type="submit"]:active { transform: scale(0.92); }
.auth-form button[type="submit"] svg { width: 22px; height: 22px; color: #FFFFFF; }
.auth-msg {
  color: #EF4444;
  font-size: 12px;
  font-weight: 700;
  min-height: 18px;
  margin-top: -6px;
}
.auth-switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 700;
  margin-top: auto;
  padding-top: 28px;
}
.auth-switch a {
  color: #18181B;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.auth-spin {
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255, 255, 255, 0.3);
  border-top-color: #FFFFFF;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="auth-shell">
  <div class="auth-header">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>
    <div class="auth-brand-pill">
      <span>💰</span>
      <span>Keloladuit.id</span>
    </div>
    <h1 class="auth-header-title">Buat<br>Akun</h1>
  </div>

  <div class="auth-body fade-up">
    <p class="auth-desc">Mulai kelola keuanganmu sekarang.</p>

    <form id="register-form" class="auth-form">
      <div class="auth-field">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" placeholder="usernamemu" autocomplete="username" required>
      </div>

      <div class="auth-field">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" placeholder="min. 4 karakter" autocomplete="new-password" required>
        <button type="button" class="pw-toggle-btn" onclick="toggleRegPasswordVisibility()" aria-label="Tampilkan Password" title="Lihat / Sembunyikan Password">
          <svg id="reg-eye-open" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          <svg id="reg-eye-closed" class="hidden" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        </button>
      </div>

      <div class="auth-field">
        <label for="register-email">Email <span style="font-weight:500;color:#D4D4D8">(opsional)</span></label>
        <input type="email" id="register-email" placeholder="kamu@email.com" autocomplete="email">
      </div>

      <div class="auth-field">
        <label for="register-nama">Nama Lengkap <span style="font-weight:500;color:#D4D4D8">(opsional)</span></label>
        <input type="text" id="register-nama" placeholder="Nama kamu" autocomplete="name">
      </div>

      <p id="register-msg" class="auth-msg"></p>

      <div class="auth-submit-row">
        <span class="auth-submit-label">Daftar</span>
        <button type="submit" id="register-submit-btn" aria-label="Daftar">
          <svg id="register-submit-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
          </svg>
          <div id="register-submit-spin" class="auth-spin hidden"></div>
        </button>
      </div>
    </form>

    <div class="auth-switch">
      <span style="color:#71717A">Sudah punya akun?</span>
      <a href="https://keloladuit.my.id/login" target="_top">Masuk</a>
    </div>
  </div>
</div>

<script>
const GLOBAL_GS_URL = 'https://script.google.com/macros/s/AKfycbxC6ZbEz0GDuxLaqkNYQEQsO4-WLB5dnEPHBhqBjqovaAizmPqlCcxBvLWTHmcD5Jth/exec';
const AUTH_SESSION_KEY = 'keuangan_akun_session';

// ── STORAGE ABSTRACTION (localStorage -> cookie -> memory) ──
var _storageMode = null;
var _memoryStore = {};
function detectStorageMode() {
  if (_storageMode) return _storageMode;
  try {
    localStorage.setItem('__storage_test__', '1');
    localStorage.removeItem('__storage_test__');
    _storageMode = 'localStorage';
    return _storageMode;
  } catch(e) {}
  try {
    document.cookie = '__storage_test__=1; SameSite=Lax; path=/';
    var ok = document.cookie.indexOf('__storage_test__=1') !== -1;
    document.cookie = '__storage_test__=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
    if (ok) { _storageMode = 'cookie'; return _storageMode; }
  } catch(e) {}
  _storageMode = 'memory';
  return _storageMode;
}
function storageGet(key) {
  var mode = detectStorageMode();
  if (mode === 'localStorage') { try { return localStorage.getItem(key); } catch(e) { return null; } }
  if (mode === 'cookie') {
    try {
      var m = document.cookie.match(new RegExp('(?:^|; )' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    } catch(e) { return null; }
  }
  return _memoryStore[key] || null;
}
function storageSet(key, value) {
  var mode = detectStorageMode();
  if (mode === 'localStorage') { try { localStorage.setItem(key, value); return true; } catch(e) { return false; } }
  if (mode === 'cookie') {
    try {
      var exp = new Date(Date.now() + 90 * 86400000).toUTCString();
      document.cookie = key + '=' + encodeURIComponent(value) + '; expires=' + exp + '; SameSite=Lax; path=/';
      return true;
    } catch(e) { return false; }
  }
  _memoryStore[key] = value;
  return true;
}

function getAkunSession() {
  try {
    const raw = storageGet(AUTH_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveAkunSession(akunData) {
  try {
    const toSave = {
      username: akunData.username,
      email: akunData.email || '',
      namaLengkap: akunData.namaLengkap || '',
      id: akunData.id,
      gsUrl: akunData.gsUrl || '',
    };
    storageSet(AUTH_SESSION_KEY, JSON.stringify(toSave));
    try {
      var exp = new Date(Date.now() + 90 * 86400000).toUTCString();
      document.cookie = AUTH_SESSION_KEY + '=' + encodeURIComponent(JSON.stringify(toSave)) + '; expires=' + exp + '; SameSite=Lax; path=/';
    } catch(e) {}
  } catch(e) {}
}

function redirectToHome() {
  try {
    window.top.location.href = 'https://keloladuit.my.id/home';
  } catch(e) {
    window.location.href = 'https://keloladuit.my.id/home';
  }
}

window.toggleRegPasswordVisibility = function() {
  const inp = document.getElementById('register-password');
  const eyeOpen = document.getElementById('reg-eye-open');
  const eyeClosed = document.getElementById('reg-eye-closed');
  if (!inp) return;
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  eyeOpen?.classList.toggle('hidden', isPass);
  eyeClosed?.classList.toggle('hidden', !isPass);
};

document.addEventListener('DOMContentLoaded', () => {
  const session = getAkunSession();
  const params = new URLSearchParams(window.location.search);
  if (session && session.username && session.gsUrl && !params.get('switch')) {
    redirectToHome();
    return;
  }
  document.getElementById('register-form')?.addEventListener('submit', handleRegisterSubmit);
});

async function handleRegisterSubmit(e) {
  e.preventDefault();
  const username = document.getElementById('register-username').value.trim();
  const password = document.getElementById('register-password').value;
  const email = document.getElementById('register-email').value.trim();
  const namaLengkap = document.getElementById('register-nama').value.trim();
  const msgEl = document.getElementById('register-msg');
  msgEl.style.color = '#EF4444';
  msgEl.textContent = '';

  if (password.length < 4) {
    msgEl.textContent = 'Password minimal 4 karakter.';
    return;
  }

  const btn = document.getElementById('register-submit-btn');
  const icon = document.getElementById('register-submit-icon');
  const spin = document.getElementById('register-submit-spin');
  btn.disabled = true;
  icon?.classList.add('hidden');
  spin?.classList.remove('hidden');

  try {
    const r = await fetch(GLOBAL_GS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'registerAkun', data: { username, password, email, namaLengkap } })
    });
    const j = await r.json();
    if (j.status === 'success') {
      if (!j.data.gsUrl) {
        msgEl.style.color = '#059669';
        msgEl.textContent = 'Akun dibuat! Silakan masuk melalui halaman Login.';
        setTimeout(() => {
          try { window.top.location.href = 'https://keloladuit.my.id/login'; }
          catch(err) { window.location.href = 'https://keloladuit.my.id/login'; }
        }, 1200);
        return;
      }
      saveAkunSession(j.data);
      try { sessionStorage.setItem('keuangan_pin_unlocked', '1'); } catch(err) {}
      msgEl.style.color = '#10B981';
      msgEl.textContent = 'Akun berhasil dibuat! Mengalihkan ke Beranda…';
      redirectToHome();
    } else {
      msgEl.textContent = j.message || 'Registrasi gagal. Coba pilih username lain.';
    }
  } catch (err) {
    msgEl.textContent = 'Gagal terhubung ke server. Periksa koneksi internet.';
  } finally {
    btn.disabled = false;
    icon?.classList.remove('hidden');
    spin?.classList.add('hidden');
  }
}
</script>
</body>
</html>
