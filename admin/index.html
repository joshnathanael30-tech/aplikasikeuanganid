<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threads</title>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #101010;
      --card-bg: #101010;
      --border-color: #232323;
      --text-main: #f3f5f7;
      --text-muted: #777777;
      --accent: #0095f6;
      --like-color: #ff3040;
      --btn-follow-bg: #f3f5f7;
      --btn-follow-text: #101010;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Top Navigation Bar */
    header {
      width: 100%;
      max-width: 620px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      background: rgba(16, 16, 16, 0.88);
      backdrop-filter: blur(14px);
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .logo-svg {
      width: 34px;
      height: 34px;
      fill: var(--text-main);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .logo-svg:hover {
      transform: scale(1.08);
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .refresh-btn:hover {
      color: var(--text-main);
      border-color: #444;
      background: #1a1a1a;
    }
    .refresh-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    .refresh-btn.rotating svg {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Container Area */
    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
    }

    /* PROFILE HEADER (Threads Style) */
    .profile-header {
      padding: 24px 16px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile-info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .profile-names {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .profile-fullname {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }

    .profile-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .profile-username {
      color: var(--text-main);
      font-weight: 500;
    }

    .badge-pill {
      background-color: #1e1e1e;
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 500;
    }

    .profile-avatar-large {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
      border: 1px solid #333;
    }

    .profile-bio {
      font-size: 14.5px;
      line-height: 1.45;
      color: #e2e2e2;
    }

    .profile-followers {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .profile-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-follow {
      flex: 1;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--btn-follow-bg);
      color: var(--btn-follow-text);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-follow:hover {
      opacity: 0.9;
    }

    /* Tabs */
    .profile-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-top: 8px;
    }

    .profile-tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }
    .profile-tab.active {
      color: var(--text-main);
    }
    .profile-tab.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--text-main);
    }

    /* THREAD CARD ITEM */
    .thread-card {
      display: flex;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.15s ease;
    }
    .thread-card:hover {
      background-color: rgba(255, 255, 255, 0.015);
    }

    .avatar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #262626;
      border: 1px solid #333;
      cursor: pointer;
    }

    .thread-line {
      width: 2px;
      flex-grow: 1;
      background-color: #2b2b2b;
      margin-top: 8px;
      margin-bottom: 4px;
      border-radius: 1px;
    }

    .content-col {
      flex: 1;
      min-width: 0;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .username-link {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-main);
      cursor: pointer;
      text-decoration: none;
    }
    .username-link:hover {
      text-decoration: underline;
    }

    .post-time {
      font-size: 13px;
      color: var(--text-muted);
    }

    .post-text {
      font-size: 15px;
      line-height: 1.48;
      color: #e5e5e5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .post-hashtag {
      display: inline-block;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-decoration: none;
    }
    .post-hashtag:hover {
      text-decoration: underline;
    }

    .post-image-container {
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      max-height: 460px;
      background: #141414;
      display: flex;
      justify-content: center;
    }

    .post-image {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 4px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border-radius: 50%;
      transition: transform 0.1s, opacity 0.2s;
    }
    .action-btn:hover {
      opacity: 0.8;
      transform: scale(1.08);
    }
    .action-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .action-btn.liked svg {
      fill: var(--like-color);
      stroke: var(--like-color);
    }

    .action-btn.liked span {
      color: var(--like-color);
    }

    .likes-count {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Comments Section */
    .comments-wrapper {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #242424;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-item {
      display: flex;
      gap: 8px;
      font-size: 13px;
      background-color: #161616;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #222;
    }

    .comment-author {
      font-weight: 600;
      color: var(--text-muted);
    }

    .comment-text {
      color: #dddddd;
      flex: 1;
      word-break: break-word;
    }

    /* Status Notifications */
    .status-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }
    .error-msg {
      color: #ff5252;
    }
  </style>
</head>
<body>

  <!-- Header Nav -->
  <header>
    <button class="nav-btn" id="backBtn" onclick="showFeedView()" style="visibility: hidden;" title="Kembali ke Feed">
      <svg viewBox="0 0 24 24">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>

    <svg class="logo-svg" onclick="showFeedView()" viewBox="0 0 192 192" title="Beranda">
      <path d="M141.537 88.9883C140.71 88.5919 139.87 88.2104 139.019 87.8451C137.537 60.5382 122.616 44.905 97.5619 44.745C97.4484 44.7443 97.3355 44.7443 97.222 44.7443C82.2364 44.7443 69.7731 51.1409 62.102 62.7807L75.481 72.7301C80.893 64.5168 88.6657 60.334 97.2057 60.334C97.2872 60.334 97.3695 60.334 97.4524 60.3347C110.383 60.4172 119.82 69.1764 121.849 84.8197C114.693 83.9145 106.915 84.1037 98.7774 85.3904C74.0048 89.3093 59.4449 102.736 61.1684 121.233C62.7163 137.847 77.0177 147.255 93.3039 147.255C108.971 147.255 120.916 139.845 127.327 126.837C133.023 138.868 143.766 146.435 158.468 146.435C169.875 146.435 179.914 141.517 186.744 132.615L174.453 122.378C169.932 128.272 164.218 131.134 158.468 131.134C148.653 131.134 142.164 124.237 141.69 113.431C148.718 107.03 154.512 99.2783 158.441 90.3541L144.974 84.2831C142.274 90.4158 138.167 95.8344 132.846 100.323C132.32 96.4862 131.162 92.6865 129.418 89.0435C133.473 89.284 137.525 89.2644 141.537 88.9883ZM125.753 108.932C122.955 116.924 114.776 131.954 93.3039 131.954C84.3754 131.954 76.5442 126.883 75.6983 117.809C74.6543 106.609 84.9711 98.7118 101.218 96.1417C107.288 95.1802 113.149 94.8872 118.665 95.228C121.722 100.178 123.639 105.419 125.753 108.932Z"/>
    </svg>

    <button class="refresh-btn" id="refreshBtn" onclick="fetchPosts()" title="Segarkan Feed">
      <svg viewBox="0 0 24 24">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Refresh
    </button>
  </header>

  <!-- VIEW 1: Main Feed -->
  <main class="container" id="feedView">
    <div class="status-msg" id="loadingText">Menghubungkan ke Spreadsheet...</div>
  </main>

  <!-- VIEW 2: Profile Page -->
  <main class="container" id="profileView" style="display: none;">
    <div id="profileHeaderContainer"></div>
    <div id="profileFeedContainer"></div>
  </main>

  <script>
    // URL Web App Google Apps Script Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1AatP5Ujs4LR9TqivKWFGvoOVcv9wH4Un5K_BzOu-TNTeU4QOSxXeZnyUpS4jq8Te/exec";

    // Tempat menyimpan data semua postingan
    let allPostsData = [];

    // Normalisasi struktur data dari Apps Script
    function normalizePost(item) {
      return {
        username: String(item.username || item.Username || "anonymous").trim(),
        time: item.time || item.Time || "",
        photoProfile: item.photoProfile || item["Photo Profile"] || item.photoprofile || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop",
        content: item.content || item.Content || "",
        image: item.image || item.Image || "",
        likes: Number(item.likes || item.Like || item.like || 0),
        comment1: item.comment1 || item["Comment #1"] || item.comment_1 || "",
        comment2: item.comment2 || item["Comment #2"] || item.comment_2 || "",
        hashtag: item.hashtag || item.Hashtag || ""
      };
    }

    // Ambil data dari Apps Script
    async function fetchPosts() {
      const feedView = document.getElementById("feedView");
      const refreshBtn = document.getElementById("refreshBtn");
      
      refreshBtn.classList.add("rotating");

      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();

        let rawPosts = [];
        if (Array.isArray(result)) {
          rawPosts = result;
        } else if (result.data && Array.isArray(result.data)) {
          rawPosts = result.data;
        }

        allPostsData = rawPosts.map(normalizePost);
        renderFeed(allPostsData, feedView);
      } catch (error) {
        console.error("Gagal mengambil data:", error);
        feedView.innerHTML = `
          <div class="status-msg error-msg">
            <p><strong>Gagal memuat postingan</strong></p>
            <p style="font-size: 13px; margin-top: 6px; color: #aaa;">Pastikan deployment Apps Script telah diberi akses <em>"Who has access: Anyone"</em>.</p>
          </div>
        `;
      } finally {
        refreshBtn.classList.remove("rotating");
      }
    }

    // Template pembuatan kartu postingan (Thread Card)
    function createThreadCard(post) {
      const card = document.createElement("article");
      card.className = "thread-card";

      const hasComments = Boolean(post.comment1 || post.comment2);
      // Bersihkan username dari karakter @ jika ada untuk keperluan fungsi
      const cleanUser = post.username.replace(/^@/, '');

      card.innerHTML = `
        <div class="avatar-col">
          <img class="avatar" 
               src="${post.photoProfile}" 
               alt="${post.username}" 
               onclick="openProfile('${escapeAttr(post.username)}')"
               onerror="this.src='https://via.placeholder.com/42/262626/888?text=U'" />
          ${hasComments ? '<div class="thread-line"></div>' : ''}
        </div>

        <div class="content-col">
          <div class="post-header">
            <span class="username-link" onclick="openProfile('${escapeAttr(post.username)}')">
              ${escapeHTML(post.username)}
            </span>
            <span class="post-time">${escapeHTML(post.time)}</span>
          </div>

          <p class="post-text">${escapeHTML(post.content)}</p>

          ${post.hashtag ? `<a href="#" class="post-hashtag">${escapeHTML(post.hashtag)}</a>` : ''}

          ${post.image ? `
            <div class="post-image-container">
              <img class="post-image" src="${post.image}" alt="Media" loading="lazy" onerror="this.parentElement.style.display='none'" />
            </div>
          ` : ''}

          <!-- Tombol Interaksi -->
          <div class="actions-bar">
            <button class="action-btn" onclick="toggleLike(this, ${post.likes})">
              <svg viewBox="0 0 24 24">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <span class="likes-count">${post.likes}</span>
            </button>

            <button class="action-btn">
              <svg viewBox="0 0 24 24">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
              </svg>
            </button>

            <button class="action-btn">
              <svg viewBox="0 0 24 24">
                <path d="M17 1l4 4-4 4"></path>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                <path d="M7 23l-4-4 4-4"></path>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
              </svg>
            </button>
          </div>

          <!-- Preview Komentar -->
          ${hasComments ? `
            <div class="comments-wrapper">
              ${post.comment1 ? `
                <div class="comment-item">
                  <span class="comment-author">balasan:</span>
                  <span class="comment-text">${escapeHTML(post.comment1)}</span>
                </div>
              ` : ''}
              ${post.comment2 ? `
                <div class="comment-item">
                  <span class="comment-author">balasan:</span>
                  <span class="comment-text">${escapeHTML(post.comment2)}</span>
                </div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;

      return card;
    }

    // Render daftar feed
    function renderFeed(posts, containerEl) {
      containerEl.innerHTML = "";

      if (!posts || posts.length === 0) {
        containerEl.innerHTML = `<div class="status-msg">Tidak ada postingan untuk ditampilkan.</div>`;
        return;
      }

      posts.forEach(post => {
        containerEl.appendChild(createThreadCard(post));
      });
    }

    // BUKA HALAMAN PROFIL PENGGUNA
    function openProfile(username) {
      const feedView = document.getElementById("feedView");
      const profileView = document.getElementById("profileView");
      const backBtn = document.getElementById("backBtn");
      const headerContainer = document.getElementById("profileHeaderContainer");
      const feedContainer = document.getElementById("profileFeedContainer");

      // Filter postingan khusus untuk username yang diklik
      const userPosts = allPostsData.filter(p => p.username.toLowerCase() === username.toLowerCase());

      // Ambil foto profil dari salah satu postingan user tersebut
      const userPhoto = userPosts.length > 0 ? userPosts[0].photoProfile : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop';
      const cleanUsername = username.startsWith('@') ? username.substring(1) : username;

      // Render Header Profil bergaya Threads
      headerContainer.innerHTML = `
        <div class="profile-header">
          <div class="profile-info-row">
            <div class="profile-names">
              <h1 class="profile-fullname">${escapeHTML(cleanUsername)}</h1>
              <div class="profile-badge-row">
                <span class="profile-username">${escapeHTML(cleanUsername)}</span>
                <span class="badge-pill">threads.net</span>
              </div>
            </div>
            <img class="profile-avatar-large" src="${userPhoto}" alt="${escapeHTML(cleanUsername)}" onerror="this.src='https://via.placeholder.com/76/262626/888?text=U'" />
          </div>

          <p class="profile-bio">Penjelajah dunia maya & penyuka diskusi terbuka.</p>
          <div class="profile-followers">${(userPosts.length * 142) + 38} pengikut</div>

          <div class="profile-actions">
            <button class="btn-follow" onclick="toggleFollow(this)">Ikuti</button>
          </div>

          <div class="profile-tabs">
            <div class="profile-tab active">Threads</div>
            <div class="profile-tab">Balasan</div>
            <div class="profile-tab">Repostingan</div>
          </div>
        </div>
      `;

      // Render postingan milik user
      renderFeed(userPosts, feedContainer);

      // Beralih tampilan
      feedView.style.display = "none";
      profileView.style.display = "flex";
      backBtn.style.visibility = "visible";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // KEMBALI KE FEED UTAMA
    function showFeedView() {
      const feedView = document.getElementById("feedView");
      const profileView = document.getElementById("profileView");
      const backBtn = document.getElementById("backBtn");

      profileView.style.display = "none";
      feedView.style.display = "flex";
      backBtn.style.visibility = "hidden";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Tombol Ikuti (Follow)
    function toggleFollow(btn) {
      if (btn.textContent === "Ikuti") {
        btn.textContent = "Mengikuti";
        btn.style.backgroundColor = "transparent";
        btn.style.color = "var(--text-main)";
      } else {
        btn.textContent = "Ikuti";
        btn.style.backgroundColor = "var(--btn-follow-bg)";
        btn.style.color = "var(--btn-follow-text)";
      }
    }

    // Toggle Like
    function toggleLike(btn, baseCount) {
      const isLiked = btn.classList.toggle("liked");
      const countEl = btn.querySelector(".likes-count");
      countEl.textContent = isLiked ? baseCount + 1 : baseCount;
    }

    // Helper sanitasi
    function escapeHTML(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(str) {
      if (!str) return "";
      return String(str).replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    // Muat data saat halaman dibuka pertama kali
    document.addEventListener("DOMContentLoaded", fetchPosts);
  </script>
</body>
</html>
