<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login dengan OTP - Bird API Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      color: #1a1a24;
      font-size: 24px;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      color: #666;
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
    }

    .otp-input {
      text-align: center;
      letter-spacing: 6px;
      font-size: 20px;
      font-weight: bold;
    }

    .status-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      word-break: break-all;
    }

    .status-box.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }

    .status-box.success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .status-box.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .debug-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 8px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 12px;
      color: #4b5563;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Masuk Akun</h2>
    <p class="subtitle">Verifikasi OTP via Bird API</p>

    <!-- STEP 1: Input Email -->
    <div id="step-email">
      <div class="form-group">
        <label for="email">Alamat Email Penerima</label>
        <!-- Catatan: Secara default diisi sandbox email sesuai batasan akun baru Bird -->
        <input 
          type="email" 
          id="email" 
          value="delivered@messagebird.dev" 
          placeholder="contoh: delivered@messagebird.dev" 
        />
        <span class="debug-badge">Sandbox: delivered@messagebird.dev</span>
      </div>
      <button id="btn-send-otp" onclick="kirimOtp()">Kirim Kode OTP</button>
    </div>

    <!-- STEP 2: Input OTP (Awalnya Tersembunyi) -->
    <div id="step-otp" style="display: none;">
      <div class="form-group">
        <label for="otp-code">Masukkan 6-Digit OTP</label>
        <input 
          type="text" 
          id="otp-code" 
          class="otp-input" 
          maxlength="6" 
          placeholder="000000" 
        />
      </div>
      <button id="btn-verify-otp" onclick="verifikasiOtp()">Verifikasi & Masuk</button>
      <div style="margin-top: 10px; text-align: center;">
        <a href="#" onclick="resetStep()" style="font-size: 12px; color: #4f46e5; text-decoration: none;">Ganti Email</a>
      </div>
    </div>

    <!-- Kotak Log / Status Pesan -->
    <div id="status-box" class="status-box"></div>
  </div>

  <script>
    // Konfigurasi API Bird dari instruksi dan prefix EU
    const BIRD_API_KEY = "bk_eu1_VfMRQDtkbeAxiNACEVP9XQU2dS6z7";
    const BIRD_ENDPOINT = "https://eu1.platform.bird.com/workspaces/current/channels/email/messages";

    let currentOtp = null;

    function tampilkanStatus(pesan, jenis = "info") {
      const box = document.getElementById("status-box");
      box.className = `status-box ${jenis}`;
      box.innerHTML = pesan;
      box.style.display = "block";
    }

    async function kirimOtp() {
      const email = document.getElementById("email").value.trim();
      const btn = document.getElementById("btn-send-otp");

      if (!email) {
        tampilkanStatus("Harap masukkan alamat email.", "error");
        return;
      }

      // Generate 6 digit angka acak
      currentOtp = Math.floor(100000 + Math.random() * 900000).toString();

      btn.disabled = true;
      btn.innerText = "Mengirim...";
      tampilkanStatus("Menghubungi Bird API...", "info");

      /*
        Memanggil REST API Bird langsung dari browser.
        Catatan: Pemanggilan langsung dari browser ke API endpoint publik 
        membutuhkan dukungan CORS dari provider atau proxy lokal.
      */
      const payload = {
        from: {
          email: "onboarding@messagebird.dev",
          name: "Sistem Login Demo"
        },
        to: [{ email: email }],
        subject: `Kode OTP Login Anda: ${currentOtp}`,
        html: `
          <div style="font-family: Arial, sans-serif; padding: 16px;">
            <h3>Verifikasi Login</h3>
            <p>Gunakan kode OTP ini untuk masuk:</p>
            <h2 style="letter-spacing: 4px; color: #4f46e5;">${currentOtp}</h2>
          </div>
        `
      };

      try {
        const response = await fetch(BIRD_ENDPOINT, {
          method: "POST",
          headers: {
            "Authorization": `AccessKey ${BIRD_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok || response.status === 202) {
          tampilkanStatus(
            `<strong>API Berhasil! (Status ${response.status})</strong><br>` +
            `Message ID: ${data.id || 'accepted'}<br>` +
            `<em>Kode OTP untuk tes: <strong>${currentOtp}</strong></em>`,
            "success"
          );

          // Pindah ke tampilan input OTP
          document.getElementById("step-email").style.display = "none";
          document.getElementById("step-otp").style.display = "block";
        } else {
          tampilkanStatus(
            `<strong>Gagal (${response.status}):</strong> ${data.title || data.message || JSON.stringify(data)}`,
            "error"
          );
        }
      } catch (err) {
        tampilkanStatus(
          `<strong>Error Koneksi/CORS:</strong> ${err.message}<br>` +
          `<small>Tip: Jika terhalang batasan CORS browser, jalankan lewat perantara backend atau ekstensi CORS saat testing.</small><br>` +
          `<em>(Kode OTP yang dibangkitkan: <strong>${currentOtp}</strong>)</em>`,
          "error"
        );
        // Tetap buka form OTP agar Anda bisa menguji alur verifikasi
        document.getElementById("step-email").style.display = "none";
        document.getElementById("step-otp").style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerText = "Kirim Kode OTP";
      }
    }

    function verifikasiOtp() {
      const inputVal = document.getElementById("otp-code").value.trim();

      if (inputVal === currentOtp) {
        tampilkanStatus("Login Berhasil! Kode OTP cocok.", "success");
      } else {
        tampilkanStatus("Kode OTP salah! Coba periksa kembali.", "error");
      }
    }

    function resetStep() {
      document.getElementById("step-email").style.display = "block";
      document.getElementById("step-otp").style.display = "none";
      document.getElementById("status-box").style.display = "none";
      document.getElementById("otp-code").value = "";
    }
  </script>
</body>
</html>
